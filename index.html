
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <h1>My Calculator</h1>
        <p>Version 1.0 — Addition</p>

        <label for="num1">First Number</label>
        <input type="number" id="num1" placeholder="Enter first number" step="any">

        <label for="num2">Second Number</label>
        <input type="number" id="num2" placeholder="Enter second number" step="any">

        <button id="addButton">Add Numbers (+)</button>

        <div class="result-box">
            <h2>Result</h2>
            <p id="result" aria-live="polite">Your result will appear here.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
